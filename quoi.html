<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wach?! — La Route du Sel · prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EBF3; --surface:#F7F8FB; --ink:#1E1B2E; --muted:#5A586B; --line:#CBD0DF;
  --souk:#2E3A8C; --medina:#8F2D2D; --you:#B87D08; --you-soft:#F3E3BC; --riv:#1C7756; --riv-soft:#CDE8DC;
  --paper:#F6F2EA; --paper-ink:#1E1B2E; --gold:#C9A227;
  --f-ui:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-kufi:'Reem Kufi','Figtree',Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#221912; --surface:#2F231A; --ink:#F1E9DF; --muted:#B8AA9B; --line:#4A3729;
    --souk:#34419A; --medina:#962F2F; --you:#E3A21A; --you-soft:#4A3913; --riv:#2FA67C; --riv-soft:#173A2E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#221912; --surface:#2F231A; --ink:#F1E9DF; --muted:#B8AA9B; --line:#4A3729;
  --souk:#34419A; --medina:#962F2F; --you:#E3A21A; --you-soft:#4A3913; --riv:#2FA67C; --riv-soft:#173A2E;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*,*::before,*::after{box-sizing:inherit;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{margin:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;}
#app{max-width:560px;margin:0 auto;padding:14px 14px 40px;}
h1{font-family:var(--f-kufi);font-weight:700;font-size:2.15rem;line-height:1.05;margin:.3em 0 .25em;letter-spacing:.01em;}
h2{font-family:var(--f-kufi);font-weight:600;font-size:1.2rem;margin:1.4em 0 .5em;}
h3{margin:0;font-size:.95rem;font-weight:600;}
p{margin:.4em 0;}
.lede{color:var(--muted);max-width:44ch;}
.crumb{color:var(--muted);font-size:.88rem;margin:0;}
.faint{color:var(--muted);font-size:.88rem;}
button{font:inherit;color:inherit;cursor:pointer;}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--you);outline-offset:2px;}
button:disabled{opacity:.4;cursor:not-allowed;}
.primary{display:block;width:100%;margin:22px 0 8px;padding:15px 18px;border:0;border-radius:12px;background:var(--you);color:#1E1404;font-weight:700;font-size:1.05rem;}
.ghost{display:block;width:100%;padding:13px;border:1.5px solid var(--line);border-radius:12px;background:transparent;font-weight:600;}

/* --- cartes --- */
.card{position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  width:62px;height:88px;border-radius:9px;background:var(--paper);color:var(--paper-ink);border:1.5px solid #D9D2C3;
  box-shadow:0 1px 0 rgba(0,0,0,.18);padding:0;flex:none;}
.card .v{font-family:var(--f-kufi);font-weight:700;font-size:1.9rem;line-height:1;}
.card .s svg{width:15px;height:15px;display:block;}
.card .s{color:#7A5A3A;}
.card.neutral .s{color:#9A9A9A;} .card.fx-oros .s{color:#B07D0B;} .card.fx-copas .s{color:#A8322D;} .card.fx-espadas .s{color:#3C5A8A;} .card.fx-bastos .s{color:#7A5A3A;}
.card .s svg *{fill:currentColor;}
.card .mk{position:absolute;top:3px;right:5px;font-size:.72rem;color:#8A6B00;}
.card .mk+.mk{right:16px;}
.card.fx-oros{border-color:#C79A2B;box-shadow:0 0 0 2px #C79A2B inset,0 1px 0 rgba(0,0,0,.18);} .card.fx-copas{border-color:#A8322D;box-shadow:0 0 0 2px #A8322D inset,0 1px 0 rgba(0,0,0,.18);} .card.fx-espadas{border-color:#3C5A8A;box-shadow:0 0 0 2px #3C5A8A inset,0 1px 0 rgba(0,0,0,.18);} .card.fx-bastos{border-color:#7A5A3A;box-shadow:0 0 0 2px #7A5A3A inset,0 1px 0 rgba(0,0,0,.18);}
.card.sm{width:42px;height:60px;border-radius:7px;}
.card.sm .v{font-size:1.3rem;} .card.sm .s svg{width:11px;height:11px;}
.card.own-p{box-shadow:0 0 0 3px var(--you);} .card.own-r{box-shadow:0 0 0 3px var(--riv);}
button.card{transition:transform .12s ease;}
button.card.sel{transform:translateY(-10px);box-shadow:0 0 0 3px var(--you),0 6px 14px rgba(0,0,0,.25);}
.back{display:inline-block;width:16px;height:24px;border-radius:3px;background:var(--riv);opacity:.75;margin-left:-6px;border:1px solid var(--surface);}

/* --- titre --- */
.title h1{font-size:2.8rem;margin-top:.4em;}
.starters{display:grid;gap:10px;}
.starter{text-align:left;display:grid;gap:3px;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);}
.starter.on{border-color:var(--you);background:var(--you-soft);}
.st-name{font-weight:700;font-size:1.02rem;} .st-desc{color:var(--muted);font-size:.92rem;}
.st-vals{font-family:var(--f-kufi);font-size:1rem;letter-spacing:.06em;}
.seed{margin-top:18px;display:grid;gap:4px;}
.seed label{font-weight:600;font-size:.92rem;}
.seed input{font:inherit;font-family:var(--f-kufi);font-size:1.15rem;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:10ch;}
.hint{color:var(--muted);font-size:.85rem;}
.rules{margin-top:18px;border-top:1px solid var(--line);padding-top:10px;}
.rules summary{font-weight:600;cursor:pointer;padding:6px 0;}
.rules ul{padding-left:1.1em;margin:.4em 0;} .rules li{margin:.35em 0;font-size:.94rem;}

/* --- intro --- */
.intro h1{font-size:2.5rem;}
.rival-name{font-family:var(--f-kufi);font-size:1.25rem;color:var(--riv);margin:0;}
.rule{background:var(--surface);border-left:4px solid var(--medina);padding:9px 12px;border-radius:0 10px 10px 0;font-weight:600;}

/* --- jeu --- */
.top{display:flex;justify-content:space-between;align-items:baseline;}
.turn{font-size:.95rem;color:var(--muted);} .turn b{color:var(--ink);font-family:var(--f-kufi);font-size:1.25rem;}
.scores{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch;margin:10px 0 12px;}
.sc{border-radius:12px;padding:8px 10px;background:var(--surface);display:grid;}
.sc.you{border-left:5px solid var(--you);} .sc.riv{border-right:5px solid var(--riv);text-align:right;}
.sc .lab{font-size:.82rem;color:var(--muted);} .sc .pts{font-family:var(--f-kufi);font-size:1.9rem;font-weight:700;line-height:1.05;}
.sc .sub{font-size:.74rem;color:var(--muted);}
.moul{align-self:center;text-align:center;font-size:.72rem;font-weight:700;padding:6px 7px;border-radius:9px;border:1.5px dashed var(--line);color:var(--muted);}
.moul span{font-weight:500;} .moul.you{border-color:var(--you);color:var(--you);} .moul.riv{border-color:var(--riv);color:var(--riv);}

.intent{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--riv-soft);border:2px solid var(--riv);}
.intent .card{transform:rotate(-4deg);width:66px;height:94px;}
.intent-txt{flex:1;display:grid;gap:1px;}
.intent-txt .lab{font-size:.84rem;color:var(--muted);}
.intent-txt .where{font-family:var(--f-kufi);font-size:1.35rem;font-weight:700;color:var(--riv);}
.rule-mini{font-size:.76rem;color:var(--medina);font-weight:600;}
.coin{font-size:.76rem;font-weight:600;padding-left:20px;position:relative;margin-top:2px;}
.coin::before{content:'';position:absolute;left:0;top:1px;width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 2px rgba(0,0,0,.18);}
.coin-p{color:var(--you);} .coin-r{color:var(--riv);}
.riv-hand{display:flex;padding-left:6px;}

.board{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 10px;}
.zone{border-radius:14px;padding:9px 9px 11px;color:#fff;min-height:132px;}
.zS{background:var(--souk);} .zM{background:var(--medina);}
.zone h3{font-family:var(--f-kufi);font-size:1.05rem;margin-bottom:7px;letter-spacing:.02em;}
.zcards{display:flex;flex-wrap:wrap;gap:6px;}
.zone .empty{font-size:.8rem;opacity:.8;margin:0;}
.ronda-corner{margin-top:9px;padding-top:7px;border-top:1px dashed rgba(255,255,255,.4);display:flex;flex-wrap:wrap;gap:5px;font-size:.78rem;}
.ronda-corner .faint{color:rgba(255,255,255,.7);font-size:.76rem;}
.pair{font-family:var(--f-kufi);font-weight:700;padding:2px 7px;border-radius:7px;background:var(--paper);color:var(--paper-ink);}
.pair.own-p{box-shadow:0 0 0 2px var(--you);} .pair.own-r{box-shadow:0 0 0 2px var(--riv);}

.last{background:var(--surface);border-radius:12px;padding:9px 12px;font-size:.88rem;margin-bottom:10px;}
.wach{font-family:var(--f-kufi);font-weight:700;color:var(--you);font-size:1.05rem;margin-right:2px;}
@media (prefers-reduced-motion: no-preference){ .last{animation:pop .35s ease-out;} @keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}} }

.actions{display:grid;gap:8px;min-height:44px;}
.play{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;text-align:left;padding:11px 13px;border-radius:12px;border:0;color:#fff;}
.play.zS{background:var(--souk);} .play.zM{background:var(--medina);}
.play-t{grid-column:1/-1;font-weight:700;font-size:1.02rem;margin-bottom:3px;}
.pv-delta{font-weight:700;font-size:.86rem;} .pv-delta.riv{opacity:.85;}
.pv-ev{font-size:.78rem;opacity:.92;} .pv-ev.riv{opacity:.78;}
.pv-ord{grid-column:1/-1;font-size:.74rem;opacity:.75;margin-top:3px;}
.pv-branch{grid-column:1/-1;font-size:.8rem;font-weight:700;margin-top:6px;padding-top:5px;border-top:1px solid rgba(255,255,255,.3);}

.hand{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:18px 0 6px;}
.caravan{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px;padding:9px 11px;border-radius:12px;background:var(--surface);}
.caravan>.lab{font-weight:600;font-size:.86rem;width:100%;}
.cv-step{display:inline-flex;align-items:center;gap:4px;padding-right:8px;border-right:1px solid var(--line);}
.cv-step:last-child{border-right:0;}
.cv-t{font-size:.74rem;color:var(--muted);margin-right:2px;}
.corp-row{display:grid;gap:6px;margin-top:10px;}
.corp{font-size:.82rem;padding:7px 10px;border-radius:10px;background:var(--you-soft);border-left:4px solid var(--you);}

/* --- résultat / marché --- */
.result.won h1{color:var(--you);} .result.lost h1{color:var(--medina);}
.tally{width:100%;border-collapse:collapse;margin:12px 0;font-size:.95rem;}
.tally th,.tally td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;}
.tally th[scope="row"]{text-align:left;font-weight:500;color:var(--muted);}
.tally thead th{font-size:.82rem;color:var(--muted);font-weight:600;}
.gain{font-size:1.05rem;}
.purse{font-size:1.1rem;} .purse b{font-family:var(--f-kufi);font-size:1.6rem;color:var(--you);}
.msg{background:var(--you-soft);padding:8px 12px;border-radius:10px;font-size:.92rem;}
.offer{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;background:var(--surface);margin-bottom:8px;}
.offer p{margin:.15em 0 0;font-size:.86rem;color:var(--muted);}
.offer .role{color:var(--muted);font-size:.82rem;}
.offer button{flex:none;padding:9px 11px;border-radius:10px;border:1.5px solid var(--you);background:transparent;font-weight:600;font-size:.86rem;white-space:nowrap;}
.deck{display:flex;flex-wrap:wrap;gap:6px;}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:5;}
.sheet-in{background:var(--bg);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto;}
.sheet-in .deck{margin-bottom:14px;}
/* --- pile ou face --- */
.flip-ov{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:rgba(14,10,8,.72);padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));cursor:pointer;}
.flip-title{font-family:var(--f-kufi);font-size:1.5rem;font-weight:700;color:#F6F2EA;margin:0;}
.flip-stage{position:relative;width:160px;height:300px;perspective:900px;display:flex;align-items:flex-end;justify-content:center;}
.flip-toss{position:absolute;bottom:40px;left:14px;width:132px;height:132px;transform-style:preserve-3d;}
.flip-coin{position:relative;width:132px;height:132px;transform-style:preserve-3d;}
.flip-edge{position:absolute;inset:0;border-radius:50%;background:#7A5508;}
.flip-face{position:absolute;inset:0;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;font-family:var(--f-kufi);font-weight:700;}
.flip-face svg{width:54px;height:54px;}
.flip-face .fl{font-size:1.15rem;line-height:1;}
.flip-face .fs{font-size:.72rem;font-weight:600;font-family:var(--f-ui);opacity:.85;}
.f-you{transform:translateZ(5px);color:#4A3002;background:radial-gradient(circle at 35% 30%,#FBE3A0 0,#E9B53A 38%,#C98A0C 70%,#8A5E05 100%);box-shadow:inset 0 0 0 6px #A87407,inset 0 0 0 8px #F3D27A;}
.f-you svg *{fill:#9A6A06;}
.f-riv{transform:rotateX(180deg) translateZ(5px);color:#EAF7F1;background:radial-gradient(circle at 35% 30%,#7FD8B6 0,#2FA67C 40%,#1C7756 72%,#0F4A35 100%);box-shadow:inset 0 0 0 6px #155E44,inset 0 0 0 8px #6CCBA6;}
.f-riv svg *{fill:#0F4A35;}
.flip-shadow{position:absolute;bottom:22px;left:30px;width:100px;height:16px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(3px);}
.flip-res{color:#F6F2EA;text-align:center;max-width:30ch;margin:0;font-size:1.05rem;min-height:3em;opacity:0;transition:opacity .25s ease;}
.flip-res.show{opacity:1;} .flip-res b{font-family:var(--f-kufi);font-size:1.3rem;}
.flip-res.p b{color:#F2C14E;} .flip-res.r b{color:#5BD0A3;}
.flip-go{margin:0;padding:10px 22px;border-radius:999px;border:1.5px solid rgba(246,242,234,.5);background:transparent;color:#F6F2EA;font-weight:600;opacity:0;transition:opacity .25s ease;}
.flip-go.show{opacity:1;}

/* --- v2 : modules, mèches, deck --- */
.ghost.sm{width:auto;display:inline-block;padding:8px 16px;margin:10px 0 0;font-size:.9rem;}
.lab{font-size:.84rem;font-weight:600;color:var(--muted);display:block;}
.mods{display:grid;gap:10px;}
.mod{text-align:left;display:grid;gap:4px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);}
.mod.on{border-color:var(--you);background:var(--you-soft);}
.mod-t{display:flex;justify-content:space-between;align-items:baseline;} .mod-s{font-size:.8rem;color:var(--muted);font-weight:600;} .mod.on .mod-s{color:var(--you);}
.mod-d{font-size:.88rem;color:var(--muted);}
.hist{display:flex;gap:3px;align-items:flex-end;margin:8px 0 4px;}
.hb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0;}
.hb i{display:block;width:72%;background:var(--you);border-radius:3px 3px 0 0;order:2;}
.hb em{order:1;font-style:normal;font-size:.66rem;color:var(--muted);min-height:13px;}
.hb b{order:3;font-size:.68rem;font-family:var(--f-kufi);color:var(--muted);margin-top:2px;font-weight:600;}
.st-bar{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;}
.bchips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0;}
.bchip{display:inline-flex;align-items:center;gap:7px;padding:7px 8px 7px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:.92rem;min-height:40px;}
.bchip.sm{padding:3px 5px 3px 10px;font-size:.8rem;min-height:0;gap:5px;}
.bchip .fz{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:.78rem;font-weight:700;font-family:var(--f-kufi);}
.bchip.sm .fz{width:17px;height:17px;font-size:.68rem;}
button.bchip:hover:not(:disabled){border-color:var(--you);}
.bchip.on{background:var(--you);border-color:var(--you);color:#1E1404;} .bchip.on .fz{background:#1E1404;color:var(--you);}
.bchip.used{text-decoration:line-through;opacity:.5;}
.arsenal{margin:12px 0;padding:11px 12px;border-radius:14px;background:var(--surface);}
.bdesc{margin:6px 0 4px;font-size:.88rem;} .params{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
.vals{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.vb{min-width:42px;height:42px;padding:0 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-family:var(--f-kufi);font-weight:700;font-size:1.05rem;}
.vb.wide{flex:1;font-family:var(--f-ui);font-size:.9rem;} .vb.on{background:var(--you);border-color:var(--you);color:#1E1404;}
.two{display:flex;gap:8px;margin-top:6px;}
.tgt{margin-top:6px;gap:10px;} .tg{display:inline-flex;flex-direction:column;align-items:center;gap:2px;} .tg em{font-style:normal;font-size:.68rem;color:var(--muted);}
.exch{margin:10px 0;padding:10px 12px;border-radius:12px;background:var(--you-soft);border-left:4px solid var(--you);}
.tog{margin-top:6px;width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--you);background:transparent;font-weight:600;text-align:left;}
.tog.on{background:var(--you);color:#1E1404;}
.bannounce{font-size:.82rem;font-weight:600;color:var(--medina);} .spare{font-size:.8rem;color:var(--muted);}
.icards{display:flex;gap:4px;} .icards .card+.card{margin-left:-14px;transform:rotate(5deg);}
.pot{margin:-4px 0 10px;text-align:center;font-size:.84rem;color:var(--muted);} .pot b{font-family:var(--f-kufi);font-size:1.15rem;color:var(--ink);}
.rdeck{margin:14px 0 6px;} .mcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;}
.mc{display:inline-flex;align-items:baseline;gap:2px;padding:3px 9px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:.92rem;} .mc b{font-family:var(--f-kufi);font-size:1.05rem;} .mc i{font-style:normal;font-size:.76rem;color:var(--muted);}
.unseen{margin:10px 0 0;font-size:.9rem;} .unseen summary{cursor:pointer;padding:6px 0;font-weight:600;}
.fal{margin:10px 0;padding:10px 12px;border-radius:12px;border:1.5px dashed var(--riv);background:var(--riv-soft);} .fal .zcards{margin-top:6px;}
.hint-warn{background:var(--you-soft);border-left:4px solid var(--you);padding:9px 12px;border-radius:0 10px 10px 0;margin:0;font-weight:600;font-size:.92rem;}
.pv-bar{font-weight:700;} .pv-ex{font-weight:700;background:rgba(255,255,255,.14);padding:3px 6px;border-radius:6px;}
.pv-delta i{font-style:normal;opacity:.8;font-weight:500;}
.card.pairable{box-shadow:0 0 0 3px var(--you);} .card.dim{opacity:.38;}
.rsv{margin-left:auto;}
.next{margin:14px 0;padding:11px 12px;border-radius:14px;background:var(--surface);}
.dstats{margin:8px 0 12px;padding:11px 12px;border-radius:14px;background:var(--surface);}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:10px 0 8px;} .dgrid div{display:grid;} .dgrid dt{font-size:.76rem;color:var(--muted);} .dgrid dd{margin:0;font-family:var(--f-kufi);font-size:1.15rem;font-weight:700;}
.stacks{display:flex;flex-wrap:wrap;gap:16px 14px;margin:10px 0 6px;padding-bottom:8px;}
.stack{position:relative;background:none;border:0;padding:0;border-radius:10px;}

  caravanier:{name:'Caravanier',desc:'Trois baraka : chaque défaite en consomme une pour retenter le souk avec une nouvelle donne. Au marché, le sel s\u2019achète en baraka.'},
  maalem:{name:'Maalem',desc:'Aucun filet : la première défaite met fin au voyage.'},
};
function modeBadge(r){ return r.mode==='pelerin'?'Pèlerin':r.mode==='maalem'?'Maalem':`Baraka ${r.baraka}`; }
function curStages(){ return stagesOf(G.run); }
function stageDef(i){ return curStages()[i]; }
function stageLabel(i){ const f=stageInfo(G.run,i); return f.cityDef.name+' · '+(f.boss?'le Maalem':'souk '+f.nth+'/3'); }
function dailySeed(){ const d=new Date(); return d.getUTCFullYear()*10000+(d.getUTCMonth()+1)*100+d.getUTCDate(); }
function dailyLabel(){ try{ return new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}); }catch(e){ return ''; } }
function shareText(r,won){
  const total=stagesOf(r).length;
  return `La Route du Sel — ${won?'voyage accompli':'voyage interrompu'} · ${r.wins}/${total} souks · ${MODES[r.mode].name}${r.mods.ech?' · Échanges':''}${r.mods.bar?' · Baroud':''} · graine ${r.seed}`;
}
function endManche(){
  const m=G.m, r=G.run;
  r.result={win:m.win,gain:m.win?solde(m):0,ps:m.score.p,rs:m.score.r,stage:m.stage};
  if(!m.win) r.losses++;
  G.screen='result'; Sfx.play(m.win?'win':'lose'); persist();
}
// Sons : petits effets synthétisés (WebAudio), jamais de musique ; coupés par défaut si le navigateur les refuse
const Sfx=(function(){
  let ctx=null;
  function c(){ if(ctx===null){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ ctx=false; } } return ctx; }
  function tone(f,t0,d,type,v){ const x=c(); if(!x) return; const o=x.createOscillator(), g=x.createGain(), t=x.currentTime+t0;
    o.type=type||'sine'; o.frequency.value=f; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v||0.05,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(x.destination); o.start(t); o.stop(t+d+0.03); }
  const P={
    tap:()=>tone(520,0,0.05,'triangle',0.03),
    card:()=>{ tone(220,0,0.07,'square',0.03); tone(330,0.035,0.06,'triangle',0.03); },
    coin:()=>{ for(let i=0;i<7;i++) tone(1300+i*45,i*0.11,0.05,'sine',0.035); },
    cry:()=>{ tone(660,0,0.1,'square',0.035); tone(880,0.1,0.2,'square',0.035); },
    bar:()=>{ tone(180,0,0.25,'sawtooth',0.04); tone(90,0,0.3,'square',0.03); },
    buy:()=>{ tone(784,0,0.07,'triangle',0.05); tone(1175,0.07,0.13,'triangle',0.05); },
    win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*0.11,0.24,'triangle',0.06)),
    lose:()=>[392,330,262].forEach((f,i)=>tone(f,i*0.17,0.3,'sawtooth',0.04)),
  };
  return {play(n){ if(!G.settings||!G.settings.sound) return; const f=P[n]; if(f){ try{ f(); }catch(e){} } }};
})();
// Conseil du tour : une ligne, déterminée par l'état de la manche
function hintFor(m,sel){
  const it=m.intent; if(!it||!it.card) return '';
  if(m.turn===1&&!sel&&!G.barSel) return 'Le rival a annoncé sa carte. Touchez une des vôtres : l\u2019aperçu montre le résultat exact dans chaque zone.';
  if(sel){ const tie=allowedZones(m).some(z=>isTie({card:sel,zone:z},it,m)); if(tie) return 'Même rang que le rival dans la même zone : une pièce décidera qui résout d\u2019abord. L\u2019aperçu montre les deux issues.'; }
  if(it.bar&&m.bar.hand.p.includes('QONTRA')) return `Le rival allume ${BAR[it.bar.name].name} : votre Qontra peut l\u2019annuler.`;
  if(m.mods.ech&&it.zone==='M'&&rivalSpare(m)>0) return `Il garde ${rivalSpare(m)} autre${rivalSpare(m)>1?'s':''} ${it.card.v} : en cas d\u2019échange, il escaladera.`;
  if(m.turn===TURNS) return 'Dernier tour : le Moul Souk (+'+MOUL+') se joue sur la taille des piles, et la Médina peut encore faire la différence.';
  if(m.turn>=6&&Math.abs(pileValue(m,'p')-pileValue(m,'r'))<=1) return 'Les piles sont serrées : chaque carte prise au Souk peut faire basculer le Moul Souk.';
  return '';
}

// ---------- Animations de captures ----------
// Principe : le moteur a déjà résolu le tour ; on rejoue visuellement ce qui s'est passé à partir
// d'une photographie des positions prise AVANT le rendu, avec des « fantômes » de cartes dans un calque.
const Anim=(function(){
  let busy=false, skipFlag=false, layer=null, live=[], hidden=[];
  const KINDS=['captureS','captureM','ronda','tringa','pose','khatf','exchange','missa'];
  function enabled(){
    try{
      if(!G.settings||!G.settings.anim) return false;
      if(typeof document==='undefined'||typeof document.createElement!=='function'||!document.body) return false;
      if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches) return false;
      return typeof Element!=='undefined'&&typeof Element.prototype.animate==='function';
    }catch(e){ return false; }
  }
  function snap(){
    if(!enabled()) return null;
    const rects=new Map(), html=new Map(), piles={}, zone={};
    document.querySelectorAll('[data-cid]').forEach(el=>{
      const id=+el.getAttribute('data-cid'); if(rects.has(id)) return;
      const r=el.getBoundingClientRect(); if(r.width>0){ rects.set(id,r); html.set(id,el.outerHTML); } });
    ['p','r'].forEach(s=>{ const el=document.getElementById('pile-'+s); if(el){ const b=el.querySelector('b'); piles[s]={n:b?b.textContent:''}; } });
    ['S','M'].forEach(z=>{ const el=document.getElementById('zone-'+z); if(el) zone[z]=el.getBoundingClientRect(); });
    return {rects,html,piles,zone};
  }
  function willPlay(s,ev){ return !!s&&ev.some(e=>KINDS.includes(e.kind)); }
  function queue(s,ev){ if(s&&ev&&ev.length) G.anim={snap:s,ev}; }
  function ensureLayer(){ if(!layer||!layer.parentNode){ layer=document.createElement('div'); layer.className='ghost-layer'; layer.setAttribute('aria-hidden','true'); document.body.appendChild(layer); } return layer; }
  function ghost(id,S){
    const h=S.html.get(id), r=S.rects.get(id); if(!h||!r) return null;
    const d=document.createElement('div'); d.className='gcard'; d.innerHTML=h;
    const c=d.firstElementChild; if(c){ c.removeAttribute('data-act'); c.removeAttribute('data-cid'); c.removeAttribute('id'); c.classList.remove('sel','pairable','dim'); c.style.transform='none'; c.style.margin='0'; }
    d.style.left=r.left+'px'; d.style.top=r.top+'px'; d.style.width=r.width+'px'; d.style.height=r.height+'px';
    ensureLayer().appendChild(d); return d;
  }
  function center(r){ return {x:r.left+r.width/2,y:r.top+r.height/2}; }
  function cur(d){ return center(d.getBoundingClientRect()); }
  function run1(el,frames,opt){
    const a=el.animate(frames,Object.assign({fill:'forwards',easing:'cubic-bezier(.3,.1,.2,1)'},opt,{duration:skipFlag?0:(opt.duration||300),delay:skipFlag?0:(opt.delay||0)}));
    live.push(a); return a.finished.catch(()=>{});
  }
  function move(d,to,o){
    o=o||{}; const c=cur(d), dx=to.x-c.x, dy=to.y-c.y, s=o.scale==null?1:o.scale;
    const end={transform:`translate(${dx}px,${dy}px) scale(${s})`,opacity:o.fade?0.15:1};
    const frames=o.arc?[{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${dx*0.5}px,${dy*0.5-o.arc}px) scale(${1+(1-s)*0.12})`,opacity:1,offset:0.5},end]:[{transform:'translate(0,0) scale(1)',opacity:1},end];
    const p=run1(d,frames,o); if(!o.commit) return p;
    // fige la position atteinte dans le style puis annule l'animation : sinon une animation suivante (pulsation)
    // remplacerait la translation et la carte reviendrait brutalement à son point de départ
    const w=parseFloat(d.style.width)||0, h=parseFloat(d.style.height)||0, anim=live[live.length-1];
    return p.then(()=>{ if(!d.parentNode) return; d.style.left=(to.x-w/2)+'px'; d.style.top=(to.y-h/2)+'px'; try{ anim.cancel(); }catch(e){} });
  }
  function pulse(d){ return run1(d,[{transform:'scale(1)',filter:'brightness(1)'},{transform:'scale(1.14)',filter:'brightness(1.3)'},{transform:'scale(1)',filter:'brightness(1)'}],{duration:190}); }
  function dissolve(d,delay){ return run1(d,[{opacity:1,transform:'translateY(0) scale(1)'},{opacity:0,transform:'translateY(-22px) scale(.72)'}],{duration:380,delay:delay||0}); }
  function floatText(text,rect,cls){
    if(!rect) return Promise.resolve(); const f=document.createElement('div'); f.className='float '+(cls||''); f.textContent=text;
    const c=center(rect); f.style.left=c.x+'px'; f.style.top=c.y+'px'; ensureLayer().appendChild(f);
    return run1(f,[{opacity:0,transform:'translate(-50%,-30%) scale(.8)'},{opacity:1,transform:'translate(-50%,-90%) scale(1.05)',offset:0.25},{opacity:0,transform:'translate(-50%,-190%) scale(1)'}],{duration:900}).then(()=>{ if(f.parentNode) f.parentNode.removeChild(f); });
  }
  function rectOf(sel){ const el=document.querySelector(sel); return el?el.getBoundingClientRect():null; }
  function bump(side,add,shown){
    const el=document.getElementById('pile-'+side); if(!el) return; const b=el.querySelector('b');
    shown[side]=(+shown[side]||0)+add; if(b) b.textContent=shown[side];
    run1(el,[{transform:'scale(1)'},{transform:'scale(1.28)'},{transform:'scale(1)'}],{duration:260,fill:'none'});
  }
  async function beatIds(e,S,shown,ids,pileRect){
    const ghosts=[]; for(const id of ids){ const g=ghost(id,S); if(g){ g.__id=id; ghosts.push(g); } }
    const played=ghosts.find(g=>g.__id===e.played), others=ghosts.filter(g=>g!==played);
    switch(e.kind){
      case 'pose': {
        const t=document.querySelector('[data-cid="'+e.played+'"]'); const g=played||ghost(e.played,S);
        if(!g||!t){ if(t) t.style.visibility=''; return; }
        const tr=t.getBoundingClientRect(); await move(g,center(tr),{duration:340,arc:26});
        t.style.visibility=''; if(g.parentNode) g.parentNode.removeChild(g); return; }
      case 'captureS': case 'captureM': case 'ronda': case 'tringa': case 'khatf': case 'exchange': {
        try{
        if(!ghosts.length){ if(e.to==='pile'&&e.side) bump(e.side,(e.ids||[]).length,shown); return; }
        // 1) la carte jouée glisse sur la zone de capture
        const anchor=others[0]||played; if(played&&others.length) await move(played,cur(anchor),{duration:240,scale:1.06,commit:true});
        if(skipFlag) return;
        // 2) le choc : toutes les cartes concernées pulsent
        await Promise.all(ghosts.map(g=>pulse(g)));
        if(skipFlag) return;
        // 3) destination
        if(e.to==='pile'&&pileRect){
          await Promise.all(ghosts.map((g,i)=>move(g,center(pileRect),{duration:460,delay:i*55,scale:0.3,fade:true,arc:42})));
          bump(e.side,ghosts.length,shown);
        } else if(e.to==='park'){
          const corner=rectOf('.ronda-corner'); const park=new Set(e.park||[]);
          const keep=ghosts.filter(g=>park.has(g.__id)), drop=ghosts.filter(g=>!park.has(g.__id));
          const p1=keep.length&&corner?Promise.all(keep.map((g,i)=>move(g,center(corner),{duration:420,delay:i*60,scale:0.55,fade:true,arc:24}))):Promise.resolve();
          const p2=Promise.all(drop.map((g,i)=>dissolve(g,i*40)));
          if(corner) floatText('Ronda +'+(e.pts||0),corner,'gain');
          await Promise.all([p1,p2]);
        } else {
          await Promise.all(ghosts.map((g,i)=>dissolve(g,i*40)));
          if(e.kind==='tringa'){ const c=rectOf('.ronda-corner'); if(c) floatText('Tringa +'+(e.pts||0),c,'gain'); }
        }
        } finally { ghosts.forEach(g=>{ if(g.parentNode) g.parentNode.removeChild(g); }); }
        return; }
      case 'missa': { const z=S.zone.S; if(z) await floatText('Missa +'+(e.pts||1),z,'gain'); return; }
    }
  }
  function cleanup(finalPile){
    if(layer&&layer.parentNode) layer.parentNode.removeChild(layer); layer=null; live=[];
    hidden.forEach(t=>{ try{ t.style.visibility=''; }catch(e){} }); hidden=[];
    ['p','r'].forEach(s=>{ const el=document.getElementById('pile-'+s); if(el&&finalPile[s]!=null){ const b=el.querySelector('b'); if(b) b.textContent=finalPile[s]; } });
  }
  async function play(){
    const A=G.anim; G.anim=null; if(!A) return;
    busy=true; skipFlag=false; ensureLayer();
    const finalPile={}, shown={};
    ['p','r'].forEach(s=>{ const el=document.getElementById('pile-'+s); if(el){ const b=el.querySelector('b'); finalPile[s]=b?b.textContent:''; if(A.snap.piles[s]&&b){ b.textContent=A.snap.piles[s].n; shown[s]=A.snap.piles[s].n; } } });
    for(const e of A.ev){ if(e.kind==='pose'&&e.played!=null){ const t=document.querySelector('[data-cid="'+e.played+'"]'); if(t){ t.style.visibility='hidden'; hidden.push(t); } } }
    try{ for(const e of A.ev){ if(skipFlag) break; await beatIds(e,A.snap,shown,e.ids||(e.played!=null?[e.played]:[]),e.side?rectOf('#pile-'+e.side):null); } }catch(err){}
    cleanup(finalPile); busy=false;
    if(G.endPending){ G.endPending=false; endManche(); if(typeof render==='function') render(); }
  }
  function skip(){ skipFlag=true; live.forEach(a=>{ try{ a.finish(); }catch(e){} }); }
  return {enabled,snap,willPlay,queue,play,skip,busy:()=>busy};
})();

function pileHTML(side,n){ return `<span class="pile" id="pile-${side}" role="img" aria-label="Pile de capture, valeur ${n}"><i></i><i></i><i></i><b>${n}</b></span>`; }
function rulesBlock(){
  return `<details class="rules"${G.rules?' open':''}><summary data-act="rules">Comment jouer</summary>
  <ul>
    <li>Chaque tour, le rival <b>annonce</b> sa carte, sa zone et sa mèche éventuelle. Vous choisissez la vôtre ; l'aperçu montre le résultat exact avant de jouer.</li>
    <li>Une carte capture <b>toutes les cartes de même valeur</b> de sa zone, puis les valeurs <b>juste au-dessus</b>, deux marches au plus (1→2→…→7→10→11→12).</li>
    <li><b>Souk</b> : ce que vous ramassez va dans votre pile. Vider le Souk d'un coup : <b>Missa, +1</b>.</li>
    <li><b>Médina</b> : ce qu'on capture sort du jeu. Prendre votre propre carte avec sa jumelle : <b>Ronda, +2</b> ; la troisième : <b>Tringa, +3</b>. Plafond : 6.</li>
    <li>Dans une même zone, la plus haute carte résout en premier. Même rang dans la même zone : <b>pile ou face</b> au moment de résoudre ; l'aperçu montre les deux issues.</li>
    <li>La caravane ne montre que les cartes que vous recevrez <b>au prochain tour</b>. Un deck de plus de 10 cartes garde le surplus en <b>Réserve</b>.</li>
    <li>Après 8 tours, la plus grosse pile gagne le <b>Moul Souk, +${MOUL}</b>.</li>
    <li><b>Module Échanges</b> : même rang en Médina, la carte du premier restant libre : <b>Bouahd +1</b> pour le second. Le premier peut <b>Btlata +3</b> en abattant un 3ᵉ exemplaire, le second <b>Bkhmsa +5</b> avec un 4ᵉ. Seul le dernier mot compte ; chaque carte abattue est compensée depuis la Réserve.</li>
    <li><b>Module Baroud</b> : une mèche par tour, payée en poudre. Chaque mèche ne sert qu'une fois par souk. La poudre dépensée va dans la Poudrière, que le meneur ramasse à la fin.</li>
  </ul></details>`;
}

// ---------- ÉCRANS ----------
function rivalDeckBlock(s){
  return `<div class="rdeck"><span class="lab">Son deck</span><div class="mcs">${chips(countsOf(s.vals))}</div>${G.mods.bar&&s.bar&&s.bar.length?`<span class="lab">Ses mèches</span><div class="bchips">${s.bar.map(barChip).join('')}</div>`:''}</div>`;
}
function corpChip(k){const c=CORPS[k];return `<span class="corp" title="${esc(c.text)}"><b>${esc(c.name)}</b> ${esc(c.text)}</span>`;}
function scoreBlock(m){
  const pv=pileValue(m,'p'), rv=pileValue(m,'r');
  const pow=m.mods.bar?`<div class="pot" title="La poudre dépensée par les deux joueurs : le meneur la ramasse à la fin">Poudrière <b>${m.bar.pot}</b></div>`:'';
  return `<div class="scores">
    <div class="sc you"><span class="lab">Vous</span><span class="pts">${m.score.p}</span><span class="sub">annonces ${m.annM.p}/6</span>${pileHTML('p',pv)}</div>
    <div class="moul ${pv>rv?'you':rv>pv?'riv':''}" title="La plus grosse pile gagnera +${MOUL} en fin de manche">Moul Souk +${MOUL}<br><span>${pv>rv?'pour vous':rv>pv?'pour le rival':'à égalité'}</span></div>
    <div class="sc riv"><span class="lab">Rival</span><span class="pts">${m.score.r}</span><span class="sub">annonces ${m.annM.r}/6</span>${pileHTML('r',rv)}</div>
  </div>${pow}`;
}
function previewSummary(pv,noOrd,fuse){
  const own=pv.ev.filter(e=>e.side==='p'&&e.kind!=='bar').map(evText), his=pv.ev.filter(e=>e.side==='r'&&e.kind!=='bar').map(evText);
  const ex=pv.ev.filter(e=>e.kind==='exchange').map(evText), bars=pv.ev.filter(e=>e.kind==='bar').map(evText);
  const first=pv.ord[0]==='p'?'Vous résolvez en premier.':'Le rival résout en premier.';
  return `<span class="pv-delta">Vous ${pv.dps>=0?'+':''}${pv.dps} pt · pile ${pv.dpp>=0?'+':''}${pv.dpp}${fuse?` <i>(dont −${fuse} de poudre)</i>`:''}</span>
          <span class="pv-delta riv">Rival ${pv.drs>=0?'+':''}${pv.drs} pt · pile ${pv.drp>=0?'+':''}${pv.drp}</span>
          ${bars.length?`<span class="pv-ev pv-bar">${esc(bars.join(' · '))}</span>`:''}
          ${ex.length?`<span class="pv-ev pv-ex">${esc(ex.join(' · '))}</span>`:''}
          <span class="pv-ev">${esc(own.join(' · ')||'—')}</span><span class="pv-ev riv">${esc(his.join(' · ')||'—')}</span>
          ${noOrd?'':`<span class="pv-ord">${first}</span>`}`;
}
// --- mèches du joueur ---
function freeCards(m){ return [...m.zones.S.map(c=>({c,z:'S'})),...m.zones.M.map(c=>({c,z:'M'}))]; }
function barDisabled(name){
  const m=G.m, d=BAR[name], it=m.intent;
  if(!m.hand.p.length) return 'Plus de carte en main';
  if(!m.bar.hand.p.includes(name)) return 'Déjà utilisée dans ce souk';
  if(m.score.p<d.fuse) return `Poudre insuffisante (il faut ${d.fuse})`;
  if((name==='KELMA'||name==='CHERGUI')&&m.turn>=TURNS) return 'Impossible au dernier tour';
  if(name==='AOUD'){ if(!allowedZones(m).includes('M')) return 'La Médina est fermée ce tour'; if(!m.hand.p.some(c=>m.hand.p.some(x=>x!==c&&x.v===c.v))) return 'Aucune paire en main'; }
  if(name==='KHATF'&&!freeCards(m).length) return 'Aucune carte libre sur le plateau';
  if(name==='QONTRA'&&!(it&&it.bar)) return 'Le rival n\u2019allume aucune mèche ce tour';
  if(name==='FAL'&&m.turn<=m.falUntil) return 'La main du rival est déjà visible';
  return '';
}
function barReady(){ const b=G.barSel; if(!b) return true; if(b.name==='KHATF') return b.target!=null; if(b.name==='KELMA') return b.v!=null; if(b.name==='CHERGUI') return !!b.src; if(b.name==='AOUD') return !!(G.sel&&G.sel2); return true; }
function barHint(){ const b=G.barSel; if(!b) return ''; if(b.name==='KHATF'&&b.target==null) return 'Khatf : choisissez la carte à prendre sur le plateau.'; if(b.name==='KELMA'&&b.v==null) return 'Kelma : choisissez la valeur à annoncer.';
  if(b.name==='CHERGUI'&&!b.src) return 'Chergui : choisissez le sens du glissement.'; if(b.name==='AOUD'&&!(G.sel&&G.sel2)) return 'Aoud : touchez une carte de votre main qui a une jumelle.'; return ''; }
function barParams(m){
  const b=G.barSel; if(!b) return '';
  if(b.name==='KHATF') return `<div class="params"><span class="lab">Cible du Khatf</span><div class="zcards tgt">${freeCards(m).map(({c,z})=>`<span class="tg">${cardHTML(c,{small:true,action:'khatf',selected:b.target===c.id})}<em>${ZONE[z]}</em></span>`).join('')}</div></div>`;
  if(b.name==='KELMA') return `<div class="params"><span class="lab">Valeur annoncée</span><div class="vals">${VALUES.map(v=>`<button type="button" class="vb ${b.v===v?'on':''}" data-act="kv" data-v="${v}" aria-pressed="${b.v===v}">${v}</button>`).join('')}</div></div>`;
  if(b.name==='CHERGUI') return `<div class="params"><span class="lab">Sens du glissement</span><div class="two"><button type="button" class="vb wide ${b.src==='S'?'on':''}" data-act="cs" data-src="S" aria-pressed="${b.src==='S'}">Souk → Médina</button><button type="button" class="vb wide ${b.src==='M'?'on':''}" data-act="cs" data-src="M" aria-pressed="${b.src==='M'}">Médina → Souk</button></div></div>`;
  return '';
}
function arsenalBlock(m){
  if(!m.mods.bar) return '';
  const names=G.run.bar; if(!names.length) return `<section class="arsenal"><span class="lab">Vous n\u2019avez aucune mèche. Le marché en propose.</span></section>`;
  const chipsH=names.map(n=>{ const why=barDisabled(n), on=G.barSel&&G.barSel.name===n, used=!m.bar.hand.p.includes(n);
    return `<button type="button" class="bchip ${on?'on':''} ${used?'used':''}" data-act="bar" data-k="${n}" aria-pressed="${!!on}" ${why&&!on?'disabled':''} title="${esc(why||BAR[n].text)}"><b>${BAR[n].name}</b><span class="fz" aria-label="mèche ${BAR[n].fuse}">${BAR[n].fuse}</span></button>`; }).join('');
  const sel=G.barSel;

function buildPm(zone){

}
function exchangeToggle(m,sel){

// ---------- Journal de manche : déroulé complet et points par origine ----------
function jWho(side){ return side==='p'?'Vous':'Le rival'; }
function jMove(side,rec){
  if(!rec||rec.pass) return `${jWho(side)} passe${side==='p'?'z':''}`;
  const zone=ZONE_AT[rec.zone]||'';
  const bar=rec.bar?` avec ${BAR[rec.bar].name}`:'';
  const pair=rec.v2!=null?` (paire de ${rec.v})`:'';
  const esc2=rec.esc?' — escalade':'';
  return `${jWho(side)} ${rec.v}${pair} ${zone}${bar}${esc2}`;
}
function jTurns(m){
  const H=m.hist||[], pl=m.pl||[], out=[];
  const turns=[...new Set(H.map(h=>h.turn))].sort((a,b)=>a-b);
  for(const t of turns){
    const h=H.find(x=>x.turn===t);
    const pts=pl.filter(x=>x.turn===t);
    const pile=h.pile||{p:0,r:0};
    out.push({turn:t, moves:[jMove('p',h.p), jMove('r',h.r)], events:h.ev.filter(x=>x.kind!=='pose').map(evText).filter(Boolean),
      points:pts.map(x=>({side:x.side,n:x.n,label:x.label})), pile});
  }
  return out;
}
function jSummary(m){
  const sums={p:new Map(),r:new Map()};
  for(const x of (m.pl||[])){ const mp=sums[x.side]; mp.set(x.label,(mp.get(x.label)||0)+x.n); }
  const labels=[...new Set([...sums.p.keys(),...sums.r.keys()])];
  return labels.map(l=>({label:l,p:sums.p.get(l)||0,r:sums.r.get(l)||0})).filter(x=>x.p||x.r);
}
const jSign=n=>(n>0?'+':n<0?'−':'')+Math.abs(n);
function jPointLines(list){
  return list.map(x=>`<li class="jp ${x.side==='p'?'you':'riv'}"><b>${jSign(x.n)}</b> <span>${esc(x.side==='p'?'Vous':'Rival')} · ${esc(x.label)}</span></li>`).join('');
}
function journalHTML(m){
  if(!m) return '';
  const T=jTurns(m), start=(m.pl||[]).filter(x=>x.turn===0), end=(m.pl||[]).filter(x=>x.turn>TURNS);
  const sec=(title,body)=>body?`<section class="jsec"><h3>${esc(title)}</h3>${body}</section>`:'';
  const startHTML=start.length?`<ul class="jlist">${jPointLines(start)}</ul>`:'';
  const turnsHTML=T.map(t=>{
    const pile=(t.pile.p||t.pile.r)?`<p class="jpile">Pile : vous ${jSign(t.pile.p)} · rival ${jSign(t.pile.r)}</p>`:'';
    const ev=t.events.length?`<ul class="jev">${t.events.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'';
    return `<article class="jturn"><h3>Tour ${t.turn}</h3>
      <p class="jmoves"><span class="you">${esc(t.moves[0])}</span><br><span class="riv">${esc(t.moves[1])}</span></p>${ev}${pile}
      ${t.points.length?`<ul class="jlist">${jPointLines(t.points)}</ul>`:'<p class="faint">Aucun point ce tour.</p>'}</article>`; }).join('');
  const endHTML=end.length?`<ul class="jlist">${jPointLines(end)}</ul>`:'<p class="faint">Aucun point.</p>';
  const S=jSummary(m);
  const sumHTML=S.length?`<table class="jsum"><thead><tr><th>Origine</th><th>Vous</th><th>Rival</th></tr></thead><tbody>${S.map(x=>`<tr><th scope="row">${esc(x.label)}</th><td>${x.p?jSign(x.p):'—'}</td><td>${x.r?jSign(x.r):'—'}</td></tr>`).join('')}</tbody></table>`:'';
  const totals=`<p class="jtot">Total : <b class="you">vous ${m.score.p}</b> · <b class="riv">rival ${m.score.r}</b></p>`;
  return `<div class="journal">${sec('Départ',startHTML)}${turnsHTML}${sec('Fin de manche',endHTML)}${sec('Points par origine',sumHTML)}${totals}</div>`;
}
function journalSheet(){
  const m=G.m;
  return `<div class="sheet jsheet" role="dialog" aria-modal="true" aria-label="Journal de la manche"><div class="sheet-in">
    <h2>Journal de la manche</h2><p class="faint">Chaque point est listé avec son origine, tour après tour.</p>

function isVerbose(){ return !G.run || G.run.mode==='pelerin' || !!G.wt; }
// Points gagnés au dernier tour, en une ligne (version sobre)
function compactLast(m){
  const H=m.hist||[]; if(!H.length) return '';
  const t=Math.max(...H.map(h=>h.turn)), pts=(m.pl||[]).filter(x=>x.turn===t);
  if(!pts.length) return '';
  return pts.map(x=>`${x.side==='p'?'Vous':'Rival'} ${x.n>0?'+':''}${x.n} · ${x.label.split(' : ')[0]}`).join(' — ');
}
// Une zone : cliquable quand une carte est choisie et qu'on peut la jouer ici
function zoneBlock(m,z,target,pv,tie){

  const body=`<h3>${ZONE[z]}${target&&isVerbose()?' <span class="zgo">Jouer ici</span>':''}</h3>
    <div class="zcards">${cards.length?cards.map(c=>cardHTML(c,{small:true,owner:z==='M',cid:true,inert:target})).join(''):`<p class="empty">${z==='S'?'Vide — le prochain coup ici ne capture rien.':'Vide.'}</p>`}</div>
    ${z==='M'?`<div class="ronda-corner" aria-label="Coin Ronda">${parked||'<span class="faint">Coin Ronda vide</span>'}</div>`:''}`;

  } else {

               :`<span class="zprev">Vous ${d(pv.dps)} pt · pile ${d(pv.dpp)}</span><span class="zprev riv">Rival ${d(pv.drs)} pt</span>`;

}

function tallyRows(m){
  const kr=m.kelmaRes||{}, row=(lab,a,b)=>`<tr><th scope="row">${lab}</th><td>${a}</td><td>${b}</td></tr>`, rows=[];
  const kel=s=>{const o=s==='p'?'r':'p'; return (kr[s]&&kr[s].held?3:0)+(kr[o]&&!kr[o].held?2:0);};
  const pot=s=>m.potWinner===s?m.bar.pot:0, moul=s=>m.moul===s?MOUL:0;
  const miss=s=>m.missaPts[s];
  if(m.mods.bar) rows.push(row('Poudre de départ',POWDER,POWDER),row('Mèches payées',m.spent.p?'−'+m.spent.p:'0',m.spent.r?'−'+m.spent.r:'0'));
  if(m.lead) rows.push(row('Avance du rival','—','+'+m.lead));
  rows.push(row('Annonces (Ronda, Tringa)',m.annM.p,m.annM.r));
  if(m.corpPts.p||m.corpPts.r) rows.push(row('Corporations (points)',m.corpPts.p,m.corpPts.r));
  if(m.mods.ech) rows.push(row('Échanges',m.xp.p,m.xp.r));
  rows.push(row('Missa',miss('p'),miss('r')));
  if(m.mods.bar&&(kr.p||kr.r)) rows.push(row('Kelma',(kel('p')?'+'+kel('p'):'0'),(kel('r')?'+'+kel('r'):'0')));
  rows.push(row('Pile',pileValue(m,'p'),pileValue(m,'r')),row('Moul Souk',m.moul==='p'?'+'+MOUL:'—',m.moul==='r'?'+'+MOUL:'—'));
  if(m.mods.bar&&m.bar.pot>0) rows.push(row('Poudrière',m.potWinner==='p'?'+'+m.bar.pot:'—',m.potWinner==='r'?'+'+m.bar.pot:'—'));
  rows.push(row('Total',`<b>${m.score.p}</b>`,`<b>${m.score.r}</b>`));
  return rows.join('');
}

function deltaText(a,b){
  const parts=[], f=(lab,x,y)=>{ if(x!==y) parts.push(`${lab} ${x} → ${y}`); };
  f('plus longue suite',a.longestRun,b.longestRun); f('paires',a.pairs,b.pairs); f('brelans',a.trios,b.trios); f('fortes',a.high,b.high); f('faibles',a.low,b.low); f('taille',a.size,b.size);
  return parts.join(' · ')||'composition équivalente';
}

// ---------- pile ou face (animation 3D) ----------
function starSVG(){ const pts=[]; for(let i=0;i<16;i++){ const r=i%2?19:30, a=Math.PI*i/8-Math.PI/2; pts.push((32+r*Math.cos(a)).toFixed(1)+','+(32+r*Math.sin(a)).toFixed(1)); }
  return `<svg viewBox="0 0 64 64" aria-hidden="true"><polygon points="${pts.join(' ')}"/><circle cx="32" cy="32" r="8" style="opacity:.55"/></svg>`; }
let flipping=null;
function flipCoin(result,onDone){
  if(window.__onFlip) window.__onFlip(result);
  Sfx.play('coin');
  if(typeof document.createElement!=='function'){ onDone&&onDone(); return; }
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ov=document.createElement('div'); ov.className='flip-ov'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-modal','true'); ov.setAttribute('aria-label','Pile ou face');
  let edges=''; for(let z=-4;z<=4;z++) edges+=`<div class="flip-edge" style="transform:translateZ(${z}px)"></div>`;
  ov.innerHTML=`<p class="flip-title">Pile ou face</p>
    <div class="flip-stage"><div class="flip-shadow"></div><div class="flip-toss"><div class="flip-coin">${edges}
      <div class="flip-face f-you">${starSVG()}<span class="fl">Vous</span><span class="fs">face</span></div>
      <div class="flip-face f-riv">${starSVG()}<span class="fl">Rival</span><span class="fs">pile</span></div>
    </div></div></div>
    <p class="flip-res ${result}" aria-live="assertive"></p>
    <button type="button" class="flip-go">Continuer</button>`;
  document.body.appendChild(ov);
  const toss=ov.querySelector('.flip-toss'), coin=ov.querySelector('.flip-coin'), sh=ov.querySelector('.flip-shadow'), res=ov.querySelector('.flip-res'), go=ov.querySelector('.flip-go');
  const end=(result==='p'?360*5:360*5+180);
  const D=reduce?0:1500;
  let done=false, timer=null;
  const reveal=()=>{ res.innerHTML=result==='p'?'<b>Face</b><br>Vous résolvez en premier.':'<b>Pile</b><br>Le rival résout en premier.'; res.classList.add('show'); go.classList.add('show'); go.focus({preventScroll:true}); };
  const close=()=>{ if(done) return; done=true; clearTimeout(timer); ov.remove(); flipping=null; onDone&&onDone(); };
  if(reduce||!coin.animate){ coin.style.transform=`rotateX(${end%360}deg)`; reveal(); }
  else{
    // le lancer : montée, retombée, petit rebond — pendant que la pièce tourne sur elle-même
    toss.animate([{transform:'translateY(0)'},{transform:'translateY(-170px)',offset:.42,easing:'cubic-bezier(.3,0,.7,1)'},{transform:'translateY(0)',offset:.82},{transform:'translateY(-18px)',offset:.9},{transform:'translateY(0)'}],{duration:D,easing:'cubic-bezier(.2,.7,.4,1)',fill:'forwards'});
    coin.animate([{transform:'rotateX(0deg)'},{transform:`rotateX(${end}deg)`}],{duration:D*0.86,easing:'cubic-bezier(.15,.55,.3,1)',fill:'forwards'});
    sh.animate([{transform:'scale(1)',opacity:1},{transform:'scale(.45)',opacity:.35,offset:.42},{transform:'scale(1)',opacity:1,offset:.82},{transform:'scale(1)',opacity:1}],{duration:D,fill:'forwards'});
    setTimeout(reveal,D*0.86);
  }
  timer=setTimeout(close,D+2600);
  ov.addEventListener('click',close);
  ov.addEventListener('keydown',e=>{ if(e.key==='Escape'||e.key==='Enter'){ e.preventDefault(); close(); } });
  flipping={close};
}

const app=document.getElementById('app');
let prevScreen=null;
function render(){
  const kf=d=>d.id||d.k||d.z||d.v||d.src||'';
  const f=document.activeElement, key=f&&f.dataset&&f.dataset.act?[f.dataset.act,kf(f.dataset)].join(':'):null;
  app.innerHTML=VIEWS[G.screen]()+globalOverlays();
  if(G.screen!==prevScreen){ window.scrollTo(0,0); prevScreen=G.screen; }
  else if(key){ const [a,b]=key.split(':'); const el=[...app.querySelectorAll(`[data-act="${a}"]`)].find(e=>kf(e.dataset)===b); if(el) el.focus({preventScroll:true}); }
  if(G.sheet){ const s=app.querySelector('.sheet button:not(:disabled)'); if(s) s.focus({preventScroll:true}); }
  if(G.anim) Anim.play();
  if((G.screen==='game'||G.screen==='tuto')&&G.pending&&!flipping){ flipCoin(G.m.coin,()=>{ dispatch('resolve'); render(); }); }
}
app.addEventListener('click',e=>{

// Chaque leçon est un plateau scripté joué par le VRAI moteur : on demande un geste précis, le moteur calcule le résultat,
// et l'explication affichée est vérifiée par `expect` (voir tests). Le parcours dépend du voyage choisi : modules, deck, mode.
const WT_FX_SUIT={oros:'D',copas:'C',espadas:'E',bastos:'B'};
function wtCard(x,own){
  if(typeof x==='object') return mk(x.v,x.fx?FX[x.fx].suit:'N',{fx:x.fx||null,owner:x.own||null});
  return mk(x,'N',{owner:own||null});
}
// Construit un plateau à partir d'une description courte
function wtBoard(m,s){
  const C=wtCard;
  m.turn=s.turn||1; m.coin=s.coin||'p'; m.caplog=[]; m.pl=m.pl.filter(x=>x.turn===0); m.hist=[]; m.out=0; m.last=null;
  m.hand.p=(s.hand||[]).map(x=>C(x)); m.draw.p=(s.draw||[]).map(x=>C(x)); m.reserve.p=(s.reserve||[]).map(x=>C(x));
  m.draw.r=[]; m.reserve.r=(s.rreserve||[]).map(x=>C(x));
  m.zones.S=(s.S||[]).map(x=>C(x)); m.zones.M=(s.M||[]).map(x=>C(x));
  m.piles.p=Array.from({length:(s.pile||[0,0])[0]},()=>C(1)); m.piles.r=Array.from({length:(s.pile||[0,0])[1]},()=>C(1));
  m.parked={p:{},r:{}}; for(const side of ['p','r']) for(const v of ((s.parked||{})[side]||[])) m.parked[side][v]=[C(v,side),C(v)];
  m.annM={p:(s.annM||[0,0])[0],r:(s.annM||[0,0])[1]};
  const base=m.mods.bar?POWDER:0; m.score={p:base+(s.score||[0,0])[0],r:base+(s.score||[0,0])[1]}; m.bonus={p:0,r:0};
  m.missaPts={p:0,r:0}; m.corpPts={p:0,r:0}; m.xp={p:0,r:0}; m.spent={p:0,r:0}; m.bar.pot=0; m.bar.kelma={p:null,r:null}; m.falUntil=0; m.moul=null; m.over=false; m.win=null;
  m.bar.hand.p=s.bar?[...s.bar]:(m.mods.bar?[...G.run.bar]:[]); m.bar.hand.r=[];
  m.rcorps=[]; m.corps=s.corps?[...s.corps]:[];
  m.hand.r=(s.rhand||[]).map(x=>C(x));
  const it=s.intent;
  if(it){ const rc=C(it.v); m.hand.r.unshift(rc); m.intent={card:rc,zone:it.zone}; if(it.bar){ m.intent.bar={name:it.bar}; m.bar.hand.r=[it.bar]; } }
  else m.intent={card:null,zone:null};

}

      {goal:'Touchez <b>Kelma</b>, choisissez la valeur <b>6</b>, puis jouez le <b>3</b> au <b>Souk</b>.',target:bp(3,'S',{kv:6}),
       board:{turn:6,hand:[3,6,11],S:[6,12],intent:{v:12,zone:'M'}},
       explain:'Vous <b>annoncez une valeur</b> : si vous la capturez à un tour ultérieur, vous marquez <b>+3</b> ; sinon le rival marque +2. Elle coûte rien, mais engage votre parole.',
       expect:(m)=>!!m.bar.kelma.p&&m.bar.kelma.p.v===6},
      {goal:'Touchez le <b>6</b>, puis le <b>Souk</b>.',target:{v:6,zone:'S'},prep:{intent:{v:12,zone:'M'}},
       explain:'Vous capturez le 6 annoncé : <b>parole tenue</b>. Le +3 est versé à la fin de la manche, et le Journal l\u2019affichera comme « Kelma tenue ».',
       expect:(m)=>m.caplog.some(e=>e.side==='p'&&e.v===6)}]};
    case 'CHERGUI': return {id:'b-CHERGUI',title:'Mèche Chergui : le vent d\u2019est',steps:[{goal:'Touchez <b>Chergui</b>, le sens <b>Médina → Souk</b>, puis jouez le <b>3</b> au <b>Souk</b>.',target:bp(3,'S',{src:'M'}),
      board:{hand:[3,2,11],M:[{v:5,own:'r'}],S:[],intent:{v:12,zone:'M'}},
      explain:'En fin de tour, toutes les cartes <b>libres</b> d\u2019une zone glissent dans l\u2019autre et perdent leur propriétaire : la base du rival quitte la Médina sans que vous l\u2019ayez capturée, et se retrouve au Souk, à prendre.',
      expect:(m)=>m.zones.S.some(c=>c.v===5)&&m.zones.M.length===0}]};
  }
  return null;
}
// ---- État du parcours
function wtOpts(){ return {mods:{ech:!!G.mods.ech,bar:!!G.mods.bar},starter:G.starter,mode:G.mode}; }
function wtFlat(L){ const out=[]; L.forEach((les,li)=>{ if(les.info) out.push({li,lesson:les,info:true,n:0,total:1}); else les.steps.forEach((s,si)=>out.push({li,lesson:les,step:s,n:si,total:les.steps.length})); }); return out; }
function wtCurrent(){ const w=G.wt; return w?w.flat[w.i]:null; }
function wtEnterStep(first){
  const w=G.wt, cur=wtCurrent(); if(!cur) return;
  w.phase=cur.info?'info':'play'; w.msg=null; resetPick(); G.pending=null; G.last=null;
  if(!cur.info){
    if(!G.m||first) { G.m=newManche(G.run,0); }
    if(cur.step.board) wtBoard(G.m,cur.step.board);
    else if(cur.step.prep){ const p=cur.step.prep; const m=G.m; m.turn=Math.min(m.turn,T_LIMIT()); if(p.intent){ const rc=wtCard(p.intent.v); m.hand.r=[rc]; m.intent={card:rc,zone:p.intent.zone}; } m.draw.p=[]; }
  }
}
const T_LIMIT=()=>TURNS-1;
function wtStart(){
  const o=wtOpts(); NEXT_TPL=2000;
  G.wtReal=null;
  G.run=newRun({seed:77,starter:o.starter,mods:o.mods,mode:o.mode,route:'route'});
  G.wt={opts:o,flat:wtFlat(wtLessons(o)),i:0,phase:'info',msg:null,active:true,tries:0};
  G.m=null; G.sheet=null; G.screen='tuto'; wtEnterStep(true);
}
function wtIsTarget(c){ const cur=wtCurrent(); if(!G.wt||!cur||cur.info||G.wt.phase!=='play') return false; const t=cur.step.target; return !!t&&c.v===t.v; }
function wtTargetZone(z){ const cur=wtCurrent(); if(!G.wt||!cur||cur.info||G.wt.phase!=='play') return false; return cur.step.target.zone===z; }
function wtAfter(spec,res,card){
  const w=G.wt, cur=wtCurrent(), m=G.m, t=cur.step.target;
  const played={v:card.v,zone:spec.bar&&spec.bar.name==='AOUD'?'M':spec.z,bar:spec.bar?spec.bar.name:null,esc:!!spec.esc,kv:spec.bar&&spec.bar.v,src:spec.bar&&spec.bar.src};
  let ok=played.v===t.v&&played.zone===t.zone&&(t.bar?played.bar===t.bar:!played.bar)&&(t.esc===undefined||played.esc===t.esc)&&(t.kv===undefined||played.kv===t.kv)&&(t.src===undefined||played.src===t.src);
  if(ok&&cur.step.expect&&!cur.step.expect(m,res)) ok=false;
  w.phase=ok?'done':'retry'; w.tries=ok?0:w.tries+1; w.lastEv=res.ev;
  w.msg=ok?null:'Presque ! Cette leçon attend un geste précis : relisez la consigne. Le plateau a été remis comme avant.';
}
function wtNext(){
  const w=G.wt;
  if(w.phase==='retry'){ let j=w.i; while(j>0&&!w.flat[j].info&&w.flat[j].step.board===undefined&&w.flat[j-1].lesson===w.flat[j].lesson) j--; w.i=j; wtEnterStep(false); return; }
  w.i++; if(w.i>=w.flat.length){ wtFinish(); return; }
  wtEnterStep(false);
}
function wtSkipLesson(){ const w=G.wt, li=w.flat[w.i].li; let j=w.i; while(j<w.flat.length&&w.flat[j].li===li) j++; if(j>=w.flat.length){ wtFinish(); return; } w.i=j; wtEnterStep(false); }
function wtFinish(){
  const o=G.wt.opts; G.settings.wtDone=true; const d=store(); d.settings=G.settings; d.stats=G.stats; storeSet(d);
  G.wt=null; G.m=null; G.run=null; G.screen='title'; G.sheet=null;
  G.starter=o.starter; G.mods=o.mods; G.mode=o.mode;
  ACT.start();
}
function wtQuit(){ G.wt=null; G.m=null; G.run=null; G.screen='title'; G.sheet=null; resetPick(); G.pending=null; G.anim=null; G.endPending=false; }
// solution automatique du geste attendu : sert au bouton « Montrez-moi » et aux tests
function wtSolve(){
  const cur=wtCurrent(); if(!cur||cur.info) return false; const t=cur.step.target, m=G.m;
  resetPick(); const hand=m.hand.p;
  if(t.bar){
    dispatch('bar',{k:t.bar});
    if(t.bar==='KELMA') dispatch('kv',{v:String(t.kv)});
    if(t.bar==='CHERGUI') dispatch('cs',{src:t.src});
  }
  let card=hand.find(c=>c.v===t.v);
  if(!card) return false;
  dispatch('pick',{id:String(card.id)});
  if(t.bar==='AOUD') { /* la jumelle est choisie automatiquement par l'action pick */ }
  if(t.esc) { if(!G.escalate) dispatch('esc',{}); }
  dispatch('play',{z:t.zone});
  return true;
}

// ---- Vues du parcours
function wtLessonsCount(L){ return L.length; }
function wtProgress(){ const w=G.wt; return Math.round(100*w.i/w.flat.length); }
function wtAskSheet(){
  const o=wtOpts(), L=wtLessons(o), F=wtFlat(L), n=L.length, min=Math.max(4,Math.round(F.length*0.45));
  return `<div class="sheet" role="dialog" aria-modal="true" aria-label="Parcours guidé"><div class="sheet-in">
    <h2>Avant de partir : le parcours guidé</h2>
    <p>${n} leçons, environ ${min} minutes. Vous jouez chaque règle sur un vrai plateau, avec le vrai moteur du jeu. Le parcours est adapté à votre voyage : ${o.mods.ech?'<b>Échanges</b>, ':''}${o.mods.bar?'<b>Baroud</b>, ':''}le deck <b>${esc(STARTERS[o.starter].name)}</b>, le mode <b>${esc(MODES[o.mode].name)}</b>.</p>
    <p class="faint">Vous pourrez le rejouer à tout moment depuis l\u2019accueil.</p>
    <button type="button" class="primary" data-act="wtstart">Commencer le parcours guidé</button>
    <button type="button" class="ghost" data-act="wtskip">Partir directement</button>
    <button type="button" class="link" data-act="wtnever">Partir directement, et ne plus me le proposer</button></div></div>`;
}
function wtCoach(){
  const w=G.wt, cur=wtCurrent(), idx=cur.li+1, tot=new Set(w.flat.map(x=>x.li)).size;
  const head=`<div class="coach-top"><span class="crumb">Parcours guidé · leçon ${idx}/${tot} · ${esc(cur.lesson.title)}</span>${cur.total>1?`<span class="coach-n">étape ${cur.n+1}/${cur.total}</span>`:''}</div><div class="coach-bar"><i style="width:${wtProgress()}%"></i></div>`;
  let body;
  if(w.phase==='play') body=`<p class="coach-goal">${cur.step.goal}</p><div class="coach-actions"><button type="button" class="ghost sm" data-act="wtshow">Montrez-moi</button><button type="button" class="link" data-act="wtskiplesson">Passer cette leçon</button></div>`;
  else if(w.phase==='done') body=`<p class="coach-ok">Bien joué.</p><p>${cur.step.explain}</p><button type="button" class="primary" data-act="wtnext">${w.i>=w.flat.length-1?'Terminer et partir en voyage':'Continuer'}</button>`;
  else body=`<p class="coach-retry">${esc(w.msg||'')}</p><p class="coach-goal">${cur.step.goal}</p><button type="button" class="primary" data-act="wtnext">Réessayer</button>`;
  return `<section class="coach ph-${w.phase}" role="region" aria-label="Parcours guidé" aria-live="polite">${head}${body}</section>`;
}
function viewTuto(){
  const w=G.wt, cur=wtCurrent(); if(!cur) return '';
  if(cur.info){
    const tot=new Set(w.flat.map(x=>x.li)).size, last=w.i>=w.flat.length-1;
    return `<main class="tuto-page"><p class="crumb">Parcours guidé · leçon ${cur.li+1}/${tot}</p><div class="coach-bar"><i style="width:${wtProgress()}%"></i></div>
      <h1>${esc(cur.lesson.title)}</h1><p class="lede">${cur.lesson.text}</p>
      <button type="button" class="primary" data-act="wtnext">${last?'Terminer et partir en voyage':'Continuer'}</button>
      <button type="button" class="link" data-act="wtskiplesson">Passer cette leçon</button> <button type="button" class="ghost sm" data-act="wtquit">Quitter le parcours</button></main>`;
  }
  let gv=viewGame(); if(w.phase!=='play') gv=gv.replace(/<section class="actions">[\s\S]*?<\/section>/,'').replace(/<p class="faint">Choisissez une carte[^<]*<\/p>/,'');
  return gv.replace('<main class="game','<main class="wtboard game').replace('<header class="top">',wtCoach()+'<header class="top">');
}
VIEWS.tuto=viewTuto;
Object.assign(ACT,{
  wtask:()=>{ G.sheet='wtask'; },
  wtstart:()=>{ wtStart(); },
  wtskip:()=>{ G.sheet=null; ACT.realstart(); },
  wtnever:()=>{ G.settings.wtDone=true; G.sheet=null; persist(); ACT.realstart(); },
  wtnext:()=>{ wtNext(); },
  wtskiplesson:()=>{ wtSkipLesson(); },
  wtquit:()=>{ wtQuit(); },
  wtshow:()=>{ wtSolve(); },
});

</script>
